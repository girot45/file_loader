version: "3.8"

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: audio_db
    ports:
      - "5432:5432"
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

    networks:
      - app-network

  api:
    build: file_loader
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8001:8000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
